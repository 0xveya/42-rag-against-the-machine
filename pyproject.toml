[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Local retrieval-augmented generation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0.0",
    "fastapi>=0.115.0",
    "fire>=0.7.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "torch",
    "tqdm>=4.66.0",
    "transformers>=5.14.1",
    "tree-sitter>=0.24.0",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-zig>=1.1.2",
    "uvicorn>=0.30.0",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
dev = ["basedpyright", "flake8", "mypy", "pytest", "ruff", "ty"]

[project.scripts]
rag_against_the_machine = "rag_against_the_machine.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_against_the_machine*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
preview = true
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.basedpyright]
include = ["src/rag_against_the_machine", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "src/*.egg-info",
    "src/**/*.egg-info",
]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.10"
files = ["src/rag_against_the_machine", "tests"]
mypy_path = "src"
exclude = [
    "^build/",
    "^dist/",
    "^data/",
    "^tests/",
    "^\\.venv/",
    "^src/.*\\.egg-info/",
    "^src/__init__\\.py$",
    "^src/__main__\\.py$",
]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
pretty = true
namespace_packages = false

[tool.ty.environment]
root = ["./src"]
python-version = "3.10"

[tool.ty.src]
include = ["src/rag_against_the_machine", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "src/*.egg-info",
    "src/**/*.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
