[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Local retrieval-augmented generation project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.24.0",
    "uvicorn>=0.30.0",
    "accelerate>=1.0.0",
    "torch",
    "transformers>=5.14.1",
    "tqdm>=4.66.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-zig>=1.1.2",
]

[project.optional-dependencies]
dev = ["flake8", "ruff", "mypy", "pytest", "ty"]

[project.scripts]
rag_against_the_machine = "rag_against_the_machine.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag_against_the_machine*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "DOC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
